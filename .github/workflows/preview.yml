name: Preview

on:
  pull_request:
    branches: [main]

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ENV: preview
      # Each PR gets its own Worker preview URL: <alias>-<worker name>.<account subdomain>.workers.dev.
      PREVIEW_ALIAS: pr-${{ github.event.pull_request.number }}
      SITE_URL: https://pr-${{ github.event.pull_request.number }}-preview-omerbalyali-com.${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}.workers.dev
    steps:
      - name: Check preview configuration
        if: vars.CLOUDFLARE_WORKERS_SUBDOMAIN == ''
        run: |
          echo "::error::Set the CLOUDFLARE_WORKERS_SUBDOMAIN repository variable (the <name> in <name>.workers.dev)."
          exit 1

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      # The cache only holds browser binaries; system libraries still need installing.
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Lint and type-check
        run: pnpm lint

      - name: Run tests
        run: pnpm test

      # Uploads a version without deploying it, so PRs don't overwrite each other.
      - name: Upload preview version
        uses: cloudflare/wrangler-action@4e88846969242f7752bcfdaf5511bfbb3985ca47 # v4.1.1
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          packageManager: pnpm
          command: versions upload --preview-alias ${{ env.PREVIEW_ALIAS }} --message "PR #${{ github.event.pull_request.number }}"

      - name: Link the preview
        run: |
          echo "Preview for this PR: $SITE_URL" >> "$GITHUB_STEP_SUMMARY"
