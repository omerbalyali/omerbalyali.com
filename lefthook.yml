commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

pre-commit:
  parallel: true
  commands:
    prettier:
      glob: "*.{ts,tsx,js,mjs,cjs,astro,css,md,mdx,json,yml,yaml}"
      run: pnpm exec prettier --check {staged_files}
    stylelint:
      glob: "*.{css,astro}"
      run: pnpm exec stylelint --max-warnings 0 {staged_files}
