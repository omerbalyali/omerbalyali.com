commit-msg:
  commands:
    commitlint:
      run: ./node_modules/.bin/commitlint --edit {1}

pre-commit:
  parallel: true
  commands:
    astro-check:
      run: ./node_modules/.bin/astro check
    prettier:
      glob: "*.{ts,tsx,js,mjs,cjs,astro,css,md,mdx,json,yml,yaml}"
      run: ./node_modules/.bin/prettier --check {staged_files}
    stylelint:
      glob: "*.{css,astro}"
      run: ./node_modules/.bin/stylelint --max-warnings 0 {staged_files}
